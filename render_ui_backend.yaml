# Render.com Blueprint for UI Backend
services:
  - type: web
    name: honeypot-ui-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r ui/requirements_ui.txt
    startCommand: uvicorn ui.ui_backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HONEYPOT_API_URL
        value: https://agentic-honey-pot-for-scam-detection-iiv4.onrender.com
      - key: API_KEY
        value: team_recursives
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
