services:
  - type: web
    name: agentic-honey-pot-for-scam-detection
    env: python
    region: singapore
    plan: free
    branch: main
    # Install dependencies for BOTH main app and UI
    buildCommand: pip install -r requirements.txt && pip install -r ui/requirements_ui.txt
    # Run both services: UI on port 8001 (background), Main on $PORT
    startCommand: |
      uvicorn ui.ui_backend:app --host 0.0.0.0 --port 8001 &
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        value: team_recursives
      - key: GUVI_CALLBACK_URL
        value: https://hackathon.guvi.in/api/updateHoneyPotFinalResult
      - key: MESSAGE_TIMEOUT_SECONDS
        value: 10
      - key: ENVIRONMENT
        value: production
      # LLM Response Enhancement Settings (higher values for more human-like, less repetitive responses)
      - key: LLM_FREQUENCY_PENALTY
        value: "0.6"
      - key: LLM_PRESENCE_PENALTY
        value: "0.4"
      - key: LLM_TOP_P
        value: "0.92"
      # New: UI Backend will use localhost since same service
      - key: HONEYPOT_API_URL
        value: http://localhost:10000
    healthCheckPath: /health
