services:
  - type: web
    name: honeypot-api
    env: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        value: team_recursives
      - key: ENVIRONMENT
        value: production
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_CONVERSATION_TURNS
        value: 15
    healthCheckPath: /health
